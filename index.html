<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TraceIt – An Intelligent Lost &amp; Found Management System for Campus Environments. Report lost items, find matches, and recover your belongings." />
    <meta name="keywords" content="lost and found, campus, university, TraceIt, report lost item" />
    <title>TraceIt – Campus Lost &amp; Found</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      /* ── Landing Page Styles from original index.html ── */
      .landing-nav {
        position: fixed; top: 0; left: 0; right: 0;
        height: var(--navbar-height);
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border-bottom: 1px solid var(--glass-border);
        z-index: var(--z-sticky);
        display: flex; align-items: center;
        padding: 0 var(--space-8);
        gap: var(--space-4);
      }
      .landing-nav__links { display: flex; align-items: center; gap: var(--space-6); margin: 0 auto; }
      .landing-nav__links a {
        font-size: var(--text-sm); font-weight: var(--fw-medium);
        color: var(--clr-text-secondary);
        transition: color var(--dur-fast);
      }
      .landing-nav__links a:hover { color: var(--clr-primary); }
      @media (max-width: 768px) { .landing-nav__links { display: none; } }

      /* Hero */
      .hero { min-height: 100vh; display: flex; align-items: center; position: relative; overflow: hidden; background: var(--clr-bg); }
      .hero__inner { max-width: var(--content-max-width); margin: 0 auto; padding: var(--space-24) var(--space-8) var(--space-16); width: 100%; }
      .hero__badge {
        display: inline-flex; align-items: center; gap: var(--space-2);
        background: rgba(var(--clr-primary-rgb), 0.10);
        color: var(--clr-primary); border: 1px solid rgba(var(--clr-primary-rgb), 0.20);
        padding: var(--space-2) var(--space-4); border-radius: var(--radius-full);
        font-size: var(--text-xs); font-weight: var(--fw-semibold); text-transform: uppercase;
        letter-spacing: 0.08em; margin-bottom: var(--space-5);
      }
      .hero__title { font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: var(--fw-extrabold); line-height: 1.1; margin-bottom: var(--space-5); }
      .hero__subtitle { font-size: var(--text-xl); color: var(--clr-text-secondary); max-width: 560px; margin-bottom: var(--space-8); line-height: var(--lh-relaxed); }
      .hero__cta { display: flex; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-12); }
      .hero__stats-label { font-size: var(--text-xs); color: var(--clr-text-tertiary); font-weight: var(--fw-medium); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: var(--space-3); }
      .hero__stats { display: flex; gap: var(--space-8); flex-wrap: wrap; }
      .hero__stat-num { font-size: var(--text-3xl); font-weight: var(--fw-extrabold); color: var(--clr-text-primary); }
      .hero__stat-label { font-size: var(--text-xs); color: var(--clr-text-tertiary); font-weight: var(--fw-medium); }

      /* Feature Cards */
      .feature-card {
        background: var(--clr-surface); border: 1px solid var(--clr-border);
        border-radius: var(--radius-xl); padding: var(--space-6);
        transition: all var(--dur-base) var(--ease-out);
      }
      .feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); border-color: rgba(var(--clr-primary-rgb), 0.20); }
      .feature-card__icon {
        width: 52px; height: 52px; border-radius: var(--radius-md);
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; margin-bottom: var(--space-4);
      }
      .feature-card__title { font-size: var(--text-lg); font-weight: var(--fw-bold); margin-bottom: var(--space-2); }
      .feature-card__desc { font-size: var(--text-sm); color: var(--clr-text-secondary); line-height: var(--lh-relaxed); }

      /* Steps */
      .step { text-align: center; padding: 0 var(--space-4); }
      .step__number {
        width: 56px; height: 56px; background: var(--gradient-brand);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        color: white; font-size: var(--text-xl); font-weight: var(--fw-extrabold);
        margin: 0 auto var(--space-4);
      }
      .step__title { font-size: var(--text-lg); font-weight: var(--fw-bold); margin-bottom: var(--space-2); }
      .step__desc { font-size: var(--text-sm); color: var(--clr-text-secondary); }

      /* Testimonials */
      .testimonial-card {
        background: var(--clr-surface); border: 1px solid var(--clr-border);
        border-radius: var(--radius-xl); padding: var(--space-6);
        transition: all var(--dur-base) var(--ease-out);
      }
      .testimonial-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); }
      .testimonial-card__stars { color: #F59E0B; font-size: var(--text-lg); margin-bottom: var(--space-3); }
      .testimonial-card__text { font-size: var(--text-sm); color: var(--clr-text-secondary); line-height: var(--lh-relaxed); font-style: italic; margin-bottom: var(--space-4); }
      .testimonial-card__author { display: flex; align-items: center; gap: var(--space-3); }
      .testimonial-card__avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-brand); display: flex; align-items: center; justify-content: center; color: white; font-weight: var(--fw-bold); font-size: var(--text-sm); }
      .testimonial-card__name { font-weight: var(--fw-semibold); color: var(--clr-text-primary); font-size: var(--text-sm); }
      .testimonial-card__role { font-size: var(--text-xs); color: var(--clr-text-tertiary); }

      /* FAQ */
      .faq-list { max-width: 760px; margin: 0 auto; }
      .faq-item { border-bottom: 1px solid var(--clr-border); }
      .faq-question {
        width: 100%; display: flex; align-items: center; justify-content: space-between;
        padding: var(--space-5) 0; text-align: left;
        font-size: var(--text-base); font-weight: var(--fw-semibold); color: var(--clr-text-primary);
        cursor: pointer; gap: var(--space-4);
        background: none; border: none; font-family: inherit;
      }
      .faq-icon { flex-shrink: 0; font-size: var(--text-xl); color: var(--clr-primary); transition: transform var(--dur-base) var(--ease-spring); }
      .faq-item.open .faq-icon { transform: rotate(45deg); }
      .faq-answer { max-height: 0; overflow: hidden; transition: max-height var(--dur-slow) var(--ease-out); }
      .faq-answer.open { max-height: 300px; }
      .faq-answer p { padding-bottom: var(--space-5); color: var(--clr-text-secondary); font-size: var(--text-sm); line-height: var(--lh-relaxed); }

      /* CTA section */
      .cta-section {
        background: var(--gradient-brand); border-radius: var(--radius-2xl);
        padding: var(--space-16) var(--space-8); text-align: center;
        margin: 0 var(--space-8) var(--space-20); position: relative; overflow: hidden;
      }
      @media (max-width: 768px) { .cta-section { margin: 0 var(--space-4) var(--space-12); padding: var(--space-10) var(--space-4); } }

      /* Stats bar */
      .stats-bar { background: var(--clr-surface); border-top: 1px solid var(--clr-border); border-bottom: 1px solid var(--clr-border); padding: var(--space-8) 0; }
      .stats-bar__inner { max-width: var(--content-max-width); margin: 0 auto; padding: 0 var(--space-8); display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); text-align: center; }
      @media (max-width: 768px) { .stats-bar__inner { grid-template-columns: repeat(2, 1fr); } }
      .stats-bar__num { font-size: var(--text-3xl); font-weight: var(--fw-extrabold); background: var(--gradient-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .stats-bar__label { font-size: var(--text-sm); color: var(--clr-text-secondary); margin-top: var(--space-1); }

      /* Footer */
      footer { background: var(--clr-surface); border-top: 1px solid var(--clr-border); padding: var(--space-10) var(--space-8) var(--space-6); }
      .footer-inner { max-width: var(--content-max-width); margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--space-10); }
      @media (max-width: 768px) { .footer-inner { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 480px) { .footer-inner { grid-template-columns: 1fr; } }
      .footer-col__title { font-size: var(--text-sm); font-weight: var(--fw-semibold); color: var(--clr-text-primary); margin-bottom: var(--space-4); }
      .footer-col__links { display: flex; flex-direction: column; gap: var(--space-2); }
      .footer-col__links a { font-size: var(--text-sm); color: var(--clr-text-secondary); transition: color var(--dur-fast); }
      .footer-col__links a:hover { color: var(--clr-primary); }
      .footer-bottom { max-width: var(--content-max-width); margin: var(--space-8) auto 0; padding-top: var(--space-6); border-top: 1px solid var(--clr-border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-4); }
      .footer-bottom p { font-size: var(--text-sm); color: var(--clr-text-tertiary); }

      /* ── Dashboard Layout Styles from original dashboard.html ── */
      .dashboard-layout {
        display: grid;
        gap: var(--space-6);
      }
      @media (min-width: 1024px) {
        .dashboard-main-grid {
          display: grid;
          grid-template-columns: 1fr 340px;
          gap: var(--space-6);
          align-items: start;
        }
      }
      .quick-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-3);
      }
      .quick-action-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: var(--space-5);
        border-radius: var(--radius-xl);
        text-decoration: none;
        border: 1.5px solid transparent;
        transition: all var(--dur-base) var(--ease-out);
        text-align: center;
        cursor: pointer;
      }
      .quick-action-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
      .quick-action-card--lost {
        background: var(--clr-danger-bg);
        border-color: rgba(239,68,68,0.20);
        color: var(--clr-danger);
      }
      .quick-action-card--found {
        background: var(--clr-success-bg);
        border-color: rgba(16,185,129,0.20);
        color: var(--clr-success);
      }
      .quick-action-card--browse {
        background: rgba(var(--clr-primary-rgb), 0.08);
        border-color: rgba(var(--clr-primary-rgb), 0.15);
        color: var(--clr-primary);
      }
      .quick-action-card--matches {
        background: var(--clr-warning-bg);
        border-color: rgba(245,158,11,0.20);
        color: var(--clr-warning);
      }
      .quick-action-card span:first-child { font-size: 28px; }
      .quick-action-card strong { font-size: var(--text-sm); font-weight: var(--fw-semibold); }

      /* ── Browse Layout Styles from original browse.html ── */
      .filter-sidebar {
        background: var(--clr-surface);
        border: 1px solid var(--clr-border);
        border-radius: var(--radius-xl);
        padding: var(--space-5);
        position: sticky;
        top: calc(var(--navbar-height) + var(--space-4));
      }
      .filter-sidebar h3 {
        font-size: var(--text-sm);
        font-weight: var(--fw-semibold);
        color: var(--clr-text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: var(--space-3);
      }
      .filter-group { margin-bottom: var(--space-5); }

      /* ── Matches Layout Styles from original matches.html ── */
      .score-legend {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        padding: var(--space-4);
        background: var(--clr-surface);
        border: 1px solid var(--clr-border);
        border-radius: var(--radius-xl);
        margin-bottom: var(--space-6);
      }
      .score-legend__item {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-size: var(--text-xs);
        color: var(--clr-text-secondary);
      }
      .score-legend__dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
